# No pull_request_target, repository secrets, mutable action tags, or shared caches.
# Only CodeQL receives write permission, limited to uploading security findings.
name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          cargo install --locked cargo-deny --version 0.20.2
          pipx install uv==0.12.17
      - run: cargo deny --locked check
      - name: Audit Python dependencies
        run: |
          mkdir -p artifacts/security
          uv export --locked --project integrations --extra locust --no-dev --no-emit-project -o artifacts/security/requirements.txt
          uvx pip-audit==2.9.0 -r artifacts/security/requirements.txt
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
