[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beansandroasters/dbtap"

[workspace.dependencies]
dbtap-core = { version = "0.1.0", path = "crates/dbtap-core" }
dbtap-proto = { version = "0.1.0", path = "crates/dbtap-proto" }
dbtap-capture = { version = "0.1.0", path = "crates/dbtap-capture" }
dbtap-logs = { version = "0.1.0", path = "crates/dbtap-logs" }
dbtap-replay = { version = "0.1.0", path = "crates/dbtap-replay" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.3"
libc = "0.2.191"
md-5 = "0.11.0"
rand = "0.10.3"
rsa = "0.10.0"
rustls = "0.23.46"
subtle = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.12"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
