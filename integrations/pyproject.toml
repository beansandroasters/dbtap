[project]
name = "dbtap-tools"
version = "0.1.0"
description = "Export dbtap measured time series to load-testing tools"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/beansandroasters/dbtap"
Documentation = "https://github.com/beansandroasters/dbtap/tree/main/integrations"
Issues = "https://github.com/beansandroasters/dbtap/issues"

[project.optional-dependencies]
locust = ["locust==2.47.0"]

[project.scripts]
dbtap-export = "dbtap_tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbtap_tools"]
